# ══════════════════════════════════════════════════════════════
#  DB Health Monitor — Deploy to Azure App Service
#  Base de datos: Azure Database for PostgreSQL Flexible Server
#  Secretos necesarios en GitHub:
#    AZURE_CREDENTIALS      -> JSON del Service Principal
#    AZURE_SUBSCRIPTION_ID -> ID de tu suscripcion Azure
#  (La contraseña de PostgreSQL se genera automaticamente)
# ══════════════════════════════════════════════════════════════

name: Deploy DB Health Monitor to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-db-health-monitor
  PG_ADMIN_USER:  dbadmin
  PG_DB_NAME:     dbmonitor

# ══════════════════════════════════════════════════════════════
jobs:

  deploy:
    name: "Desplegar Monitor en Azure App Service"
    runs-on: ubuntu-latest

    steps:

      # ── Checkout ─────────────────────────────────────────────
      - name: Checkout codigo
        uses: actions/checkout@v4

      # ── Login Azure ──────────────────────────────────────────
      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Establecer suscripcion
        run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # ── Nombres deterministas + contraseña auto-generada ────────
      - name: Generar nombres de recursos
        id: names
        run: |
          SUFFIX=$(echo -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" | sha256sum | cut -c1-10)
          echo "webapp=db-monitor-${SUFFIX}"     >> $GITHUB_OUTPUT
          echo "plan=asp-db-monitor-${SUFFIX}"   >> $GITHUB_OUTPUT
          echo "pgserver=pg-monitor-${SUFFIX}"   >> $GITHUB_OUTPUT
          echo "suffix=${SUFFIX}"                >> $GITHUB_OUTPUT

          # Contraseña determinista: siempre igual para la misma suscripcion,
          # cumple requisitos Azure (mayus + minus + numero + especial, 20+ chars)
          HASH=$(echo -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}pg-salt-2026" | sha256sum | cut -c1-14)
          PG_PASS="Db${HASH}Az1!"
          echo "pg_pass=${PG_PASS}" >> $GITHUB_OUTPUT

      # ── App Service Plan (auto-region) ───────────────────────
      - name: Crear Resource Group y App Service Plan
        id: infra
        run: |
          PLAN="${{ steps.names.outputs.plan }}"

          EXISTS=$(az appservice plan show \
            --name "$PLAN" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "name" -o tsv 2>/dev/null || true)

          if [ -n "$EXISTS" ]; then
            echo "App Service Plan ya existe."
            LOC=$(az appservice plan show \
              --name "$PLAN" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "location" -o tsv 2>/dev/null || echo "centralus")
            echo "resolved_location=${LOC}" >> $GITHUB_OUTPUT
            exit 0
          fi

          REGIONS=(
            "centralus" "swedencentral" "northeurope" "westeurope"
            "uksouth" "francecentral" "germanywestcentral"
            "australiaeast" "southeastasia" "centralindia"
            "japaneast" "canadacentral" "eastus" "eastus2"
          )

          CREATED=false
          for REGION in "${REGIONS[@]}"; do
            echo ">>> Intentando region: ${REGION}"
            az group create \
              --name     "${{ env.RESOURCE_GROUP }}" \
              --location "${REGION}" \
              --output none 2>/dev/null || true

            if timeout 120 az appservice plan create \
              --name           "$PLAN" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --location       "${REGION}" \
              --sku            B1 \
              --is-linux \
              --output none 2>&1; then
              echo "Plan creado en: ${REGION}"
              echo "resolved_location=${REGION}" >> $GITHUB_OUTPUT
              CREATED=true
              break
            else
              az appservice plan delete \
                --name "$PLAN" \
                --resource-group "${{ env.RESOURCE_GROUP }}" \
                --yes 2>/dev/null || true
            fi
          done

          if [ "$CREATED" = false ]; then
            echo "ERROR: No se pudo crear el App Service Plan."
            exit 1
          fi

      # NOTE: PostgreSQL server creation is skipped because the database
      # will be hosted externally (on the Elastika VM). The workflow
      # deploys only the web application.

      # ── Web App ──────────────────────────────────────────────
      - name: Crear Web App (si no existe)
        run: |
          APP="${{ steps.names.outputs.webapp }}"
          EXISTS=$(az webapp show \
            --name "$APP" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "name" -o tsv 2>/dev/null || true)

          if [ -z "$EXISTS" ]; then
            az webapp create \
              --name           "$APP" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --plan           "${{ steps.names.outputs.plan }}" \
              --runtime        "PYTHON|3.11" \
              --output none
            echo "Web App creada: ${APP}"
          else
            echo "Web App ya existe: ${APP}"
          fi

      # ── App Settings ─────────────────────────────────────────
      - name: Configurar App Settings (sin crear DB)
        run: |
          az webapp config appsettings set \
            --name           "${{ steps.names.outputs.webapp }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --settings \
              WEBSITES_PORT="5000" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="true" \
            --output none

      # ── Startup command ──────────────────────────────────────
      - name: Configurar startup command
        run: |
          az webapp config set \
            --name           "${{ steps.names.outputs.webapp }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --startup-file   "gunicorn --bind=0.0.0.0:5000 --workers=1 --threads=2 --timeout=120 server:app" \
            --output none

      # ── Deploy ───────────────────────────────────────────────
      - name: Desplegar aplicacion
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.names.outputs.webapp }}
          package: .

      # ── Health check post-deploy ─────────────────────────────
      - name: Verificar despliegue (health check)
        run: |
          APP_URL="https://${{ steps.names.outputs.webapp }}.azurewebsites.net"
          echo "Esperando que la app arranque..."
          for i in $(seq 1 18); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/api/health" || echo "000")
            echo "  Intento ${i}/18 — HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✔ App respondiendo correctamente"
              break
            fi
            sleep 10
          done

      # ── URL final ────────────────────────────────────────────
      - name: Mostrar URL del dashboard
        run: |
          echo ""
          echo "=========================================="
          echo "  Dashboard disponible en:"
          echo "  https://${{ steps.names.outputs.webapp }}.azurewebsites.net"
          echo "=========================================="
