name: Deploy DB Health Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-db-health-monitor

jobs:
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Establecer suscripcion
        run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # ── Nombres deterministas ────────────────────────────────────────────────
      - name: Generar nombres
        id: names
        run: |
          SUFFIX=$(echo -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" | sha256sum | cut -c1-10)
          echo "webapp=db-monitor-${SUFFIX}"   >> $GITHUB_OUTPUT
          echo "plan=asp-db-monitor-${SUFFIX}" >> $GITHUB_OUTPUT

      # ── App Service Plan ─────────────────────────────────────────────────────
      - name: Crear/verificar App Service Plan
        run: |
          PLAN="${{ steps.names.outputs.plan }}"
          RG="${{ env.RESOURCE_GROUP }}"

          EXISTS=$(az appservice plan show --name "$PLAN" --resource-group "$RG" --query "name" -o tsv 2>/dev/null || true)
          if [ -n "$EXISTS" ]; then
            echo "Plan ya existe: $PLAN"
            exit 0
          fi

          # Intentar regiones hasta encontrar una disponible
          for REGION in centralus eastus westus northeurope westeurope uksouth; do
            echo ">>> Probando región: $REGION"
            az group create --name "$RG" --location "$REGION" --output none 2>/dev/null || true
            if az appservice plan create \
              --name "$PLAN" --resource-group "$RG" \
              --location "$REGION" --sku B1 --is-linux --output none 2>&1; then
              echo "Plan creado en $REGION"
              break
            fi
          done

      # ── Web App ──────────────────────────────────────────────────────────────
      - name: Crear/actualizar Web App
        run: |
          APP="${{ steps.names.outputs.webapp }}"
          RG="${{ env.RESOURCE_GROUP }}"
          PLAN="${{ steps.names.outputs.plan }}"

          EXISTS=$(az webapp show --name "$APP" --resource-group "$RG" --query "name" -o tsv 2>/dev/null || true)
          if [ -z "$EXISTS" ]; then
            az webapp create \
              --name "$APP" --resource-group "$RG" \
              --plan "$PLAN" --runtime "PYTHON|3.11" --output none
          fi

      # ── App Settings ─────────────────────────────────────────────────────────
      - name: Configurar App Settings
        run: |
          APP="${{ steps.names.outputs.webapp }}"
          RG="${{ env.RESOURCE_GROUP }}"

          az webapp config appsettings set \
            --name "$APP" --resource-group "$RG" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT="true" \
              WEBSITES_PORT="5000" \
              PYTHONDONTWRITEBYTECODE="1" \
            --output none

      # ── Startup command ───────────────────────────────────────────────────────
      - name: Configurar startup command
        run: |
          az webapp config set \
            --name "${{ steps.names.outputs.webapp }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --startup-file "gunicorn --bind=0.0.0.0:5000 --workers=1 --threads=4 --timeout=120 --keep-alive=5 server:app" \
            --output none

      # ── Deploy ────────────────────────────────────────────────────────────────
      - name: Desplegar aplicacion
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.names.outputs.webapp }}
          package: .

      # ── Health check ──────────────────────────────────────────────────────────
      - name: Health check post-deploy
        run: |
          APP_URL="https://${{ steps.names.outputs.webapp }}.azurewebsites.net"
          echo "Esperando app en: $APP_URL"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/api/health" || echo "000")
            echo "  Intento ${i}/20 - HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "[OK] App respondiendo correctamente"
              echo "Dashboard: ${APP_URL}"
              exit 0
            fi
            sleep 15
          done
          echo "[WARN] Health check no paso, revisar logs de Azure"

      - name: Mostrar URL
        run: echo "Dashboard disponible en https://${{ steps.names.outputs.webapp }}.azurewebsites.net"
