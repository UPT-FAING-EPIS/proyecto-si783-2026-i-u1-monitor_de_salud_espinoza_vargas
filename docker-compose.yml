version: "3.9"

# ============================================================
# MSBDD - Monitor de Salud de Base de Datos
# Escuela Profesional de Ingeniería de Sistemas - UPT
# ============================================================
# Uso:
#   docker compose up --build        → Levanta todo
#   docker compose down              → Detiene y elimina contenedores
#   docker compose logs -f backend   → Ver logs del backend
#   docker compose logs -f dashboard → Ver logs del dashboard
# ============================================================

services:

  # ── PostgreSQL: Motor monitoreado ──────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: msbdd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: msbdd_db
      POSTGRES_USER: msbdd_user
      POSTGRES_PASSWORD: msbdd_pass
    ports:
      - "5432:5432"  # Expuesto para conexión con DBeaver/pgAdmin
    volumes:
      - msbdd_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c max_connections=100
        -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msbdd_user -d msbdd_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - msbdd_red

  # ── Backend: FastAPI + SQLAlchemy + psycopg2 ───────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: msbdd_backend
    restart: unless-stopped
    environment:
      BD_HOST: postgres
      BD_PUERTO: 5432
      BD_NOMBRE: msbdd_db
      BD_USUARIO: msbdd_user
      BD_CONTRASENA: msbdd_pass
      UMBRAL_CPU: 85
      UMBRAL_MEMORIA: 80
      UMBRAL_CONEXIONES: 80
      UMBRAL_CONSULTA_LENTA: 3.0
      INTERVALO_RECOLECCION: 30
      CICLOS_CONFIRMACION: 2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - msbdd_red
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Dashboard: Dash + Plotly ───────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: msbdd_dashboard
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      INTERVALO_DASHBOARD_MS: 15000
      UMBRAL_CPU: 85
      UMBRAL_MEMORIA: 80
      UMBRAL_CONEXIONES: 80
    ports:
      - "8050:8050"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - msbdd_red

volumes:
  msbdd_pgdata:
    driver: local

networks:
  msbdd_red:
    driver: bridge
