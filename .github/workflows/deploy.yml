# ══════════════════════════════════════════════════════════════
#  DB Health Monitor — Deploy to Azure App Service
#  Base de datos: SQLite embebido (sin dependencias externas)
#  Secretos necesarios en GitHub:
#    AZURE_CREDENTIALS       -> JSON del Service Principal
#    AZURE_SUBSCRIPTION_ID  -> ID de tu suscripcion Azure
# ══════════════════════════════════════════════════════════════

name: Deploy DB Health Monitor to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-db-health-monitor
  LOCATION: centralus

# ══════════════════════════════════════════════════════════════
jobs:

  deploy:
    name: "Desplegar Monitor en Azure App Service"
    runs-on: ubuntu-latest

    steps:

      # ── Checkout ─────────────────────────────────────────────
      - name: Checkout codigo
        uses: actions/checkout@v4

      # ── Login Azure ──────────────────────────────────────────
      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Establecer suscripcion
        run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # ── Nombres deterministas ────────────────────────────────
      - name: Generar nombres de recursos
        id: names
        run: |
          SUFFIX=$(echo -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" | sha256sum | cut -c1-10)
          echo "webapp=db-monitor-${SUFFIX}"     >> $GITHUB_OUTPUT
          echo "plan=asp-db-monitor-${SUFFIX}"   >> $GITHUB_OUTPUT
          echo "suffix=${SUFFIX}"                 >> $GITHUB_OUTPUT

      # ── App Service Plan (auto-region) ───────────────────────
      - name: Crear Resource Group y App Service Plan (auto-region)
        id: infra
        run: |
          PLAN="${{ steps.names.outputs.plan }}"

          # Verificar si ya existe
          EXISTS=$(az appservice plan show \
            --name "$PLAN" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "name" -o tsv 2>/dev/null || true)

          if [ -n "$EXISTS" ]; then
            echo "App Service Plan ya existe."
            LOC=$(az appservice plan show \
              --name "$PLAN" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "location" -o tsv 2>/dev/null || echo "swedencentral")
            echo "resolved_location=${LOC}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Regiones en orden de prioridad para suscripciones Student
          REGIONS=(
            "centralus"
            "swedencentral"
            "northeurope"
            "westeurope"
            "uksouth"
            "francecentral"
            "germanywestcentral"
            "norwayeast"
            "switzerlandnorth"
            "australiaeast"
            "southeastasia"
            "centralindia"
            "japaneast"
            "koreacentral"
            "canadacentral"
            "brazilsouth"
            "eastus"
            "eastus2"
            "westus2"
            "southcentralus"
          )

          CREATED=false

          for REGION in "${REGIONS[@]}"; do
            echo ""
            echo ">>> Intentando region: ${REGION}"

            # Crear resource group en esta region
            az group create \
              --name     "${{ env.RESOURCE_GROUP }}" \
              --location "${REGION}" \
              --output none 2>/dev/null || true

            # Intentar crear App Service Plan con timeout
            if timeout 120 az appservice plan create \
              --name           "$PLAN" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --location       "${REGION}" \
              --sku            B1 \
              --is-linux \
              --output none 2>&1; then
              echo "App Service Plan creado en: ${REGION}"
              echo "resolved_location=${REGION}" >> $GITHUB_OUTPUT
              CREATED=true
              break
            else
              echo "    Fallo o timeout en ${REGION}, siguiente..."
              az appservice plan delete \
                --name "$PLAN" \
                --resource-group "${{ env.RESOURCE_GROUP }}" \
                --yes 2>/dev/null || true
            fi
          done

          if [ "$CREATED" = false ]; then
            echo "ERROR: No se pudo crear el App Service Plan en ninguna region."
            exit 1
          fi

      # ── Web App ──────────────────────────────────────────────
      - name: Crear Web App (si no existe)
        run: |
          APP="${{ steps.names.outputs.webapp }}"
          EXISTS=$(az webapp show \
            --name "$APP" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "name" -o tsv 2>/dev/null || true)

          if [ -z "$EXISTS" ]; then
            az webapp create \
              --name           "$APP" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --plan           "${{ steps.names.outputs.plan }}" \
              --runtime        "PYTHON|3.11" \
              --output none
            echo "Web App creada: ${APP}"
          else
            echo "Web App ya existe: ${APP}"
          fi

      # ── App Settings ─────────────────────────────────────────
      - name: Configurar App Settings
        run: |
          az webapp config appsettings set \
            --name           "${{ steps.names.outputs.webapp }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --settings \
              SQLITE_PATH="/home/db_health.db" \
              WEBSITES_PORT="5000" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="true" \
            --output none

      # ── Startup command ──────────────────────────────────────
      - name: Configurar startup command
        run: |
          az webapp config set \
            --name           "${{ steps.names.outputs.webapp }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --startup-file   "gunicorn --bind=0.0.0.0:5000 --workers=1 --timeout=120 --preload server:app" \
            --output none

      # ── Deploy ───────────────────────────────────────────────
      - name: Desplegar aplicacion
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.names.outputs.webapp }}
          package: .

      # ── URL final ────────────────────────────────────────────
      - name: Mostrar URL del dashboard
        run: |
          echo ""
          echo "=========================================="
          echo "  Dashboard disponible en:"
          echo "  https://${{ steps.names.outputs.webapp }}.azurewebsites.net"
          echo "=========================================="
